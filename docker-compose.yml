services:
  postgres:
    image: postgres:16
    container_name: medislot-postgres
    environment:
      POSTGRES_DB: medislot
      POSTGRES_USER: ${DB_USERNAME:-medislot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or a .env file next to this file}
    ports:
      - "5432:5432"
    volumes:
      - medislot_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: medislot-redis
    ports:
      - "6379:6379"

volumes:
  medislot_pgdata: