spring:
  application:
    name: medislot
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medislot}
    username: ${DB_USERNAME:medislot}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none                  # schema is owned by Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

medislot:
  search:
    default-radius-km: ${DEFAULT_HOSPITAL_SEARCH_RADIUS_KM:3}
    radius-options-km: 1,3,5,10,25,50
  booking:
    max-active-appointments: ${MAX_ACTIVE_APPOINTMENTS:3}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}             # required, no default on purpose
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  auth:
    otp-expiry-minutes: 10
    otp-max-attempts: 5
    otp-resend-cooldown-seconds: 60
    max-failed-logins: 5
    lock-minutes: 15