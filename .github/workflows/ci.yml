name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
        working-directory: medislot-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: medislot-frontend/package-lock.json
      - run: npm ci
        working-directory: medislot-frontend
      - run: npm test
        working-directory: medislot-frontend
      - run: npm run build
        working-directory: medislot-frontend